  /products/{productId}/variants/{variantId}/plans:
    post:
      summary: "Assign a variant to a subscription plan"
      tags:
        - "products"
      description: "Associates a specific product variant with a subscription plan group, making only that variant available for subscription purchase under that plan."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                planId:
                  minLength: 1
                  description: "The subscription plan identifier"
                  type: "string"
              required:
                - "planId"
        required: true
      parameters:
        - schema:
            minLength: 1
            type: "string"
          in: "path"
          name: "productId"
          required: true
          description: "The product identifier"
        - schema:
            minLength: 1
            type: "string"
          in: "path"
          name: "variantId"
          required: true
          description: "The variant identifier"
        - $ref: "#/components/parameters/TenantHeader"
      x-speakeasy-name-override: "assignVariantToPlan"
      x-speakeasy-mcp:
        scopes:
          - write
      x-speakeasy-group: "products"
      responses:
        "200":
          description: "Default Response"
          content:
