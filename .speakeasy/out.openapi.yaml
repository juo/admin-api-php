          description: "Bad request — invalid input or violated business rule (e.g., wrong subscription status for the requested operation)."
        "401":
          description: "Unauthorized — missing, expired, or invalid API key."
        "403":
          description: "Forbidden — authenticated but not permitted to access this resource."
        "404":
          description: "Not found — the resource does not exist or belongs to a different tenant."
        "422":
          description: "Unprocessable entity — well-formed request that fails semantic validation."
    post:
      summary: "Create a schedule adjustment"
      tags:
        - "schedules"
      description: "Creates a modification to upcoming orders matched by cycle number, date, or both. Adjustments can match a single order or a range of orders depending on the matcher criteria. This does NOT change the subscription — it only affects the matched upcoming order(s). Supported types: skip order, change date, update shipping address or method, change payment method, modify products (add/remove/change quantity), or apply a discount. For permanent changes, update the subscription directly."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                customerId:
                  minLength: 1
                  description: "The customer identifier"
                  type: "string"
                matcher:
                  anyOf:
                    - description: "Match by cycle number"
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          enum:
                            - "CYCLE"
                        input:
                          type: "object"
                          properties:
                            cycle:
                              minimum: 0
                              description: "Target cycle number"
                              type: "integer"
                          required:
                            - "cycle"
                      required:
                        - "type"
                        - "input"
                    - description: "Match by date"
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          enum:
                            - "DATE"
                        input:
                          type: "object"
                          properties:
                            date:
                              format: "date-time"
                              description: "Target date for the adjustment"
                              type: "string"
                          required:
                            - "date"
                      required:
                        - "type"
                        - "input"
                    - description: "Match by both cycle and date"
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          enum:
                            - "CYCLE_AND_DATE"
                        input:
                          type: "object"
                          properties:
                            cycle:
                              minimum: 0
                              description: "Target cycle number"
                              type: "integer"
                            date:
                              format: "date-time"
                              description: "Target date for the adjustment"
                              type: "string"
                          required:
                            - "cycle"
                            - "date"
                      required:
                        - "type"
                        - "input"
                action:
                  anyOf:
                    - description: "Skip an order in the schedule"
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          enum:
                            - "SKIP_ORDER"
                        input:
                          type: "object"
                          properties:
                            reason:
                              description: "Reason for skipping the order"
                              type: "string"
                          required:
                            - "reason"
                      required:
                        - "type"
                        - "input"
                    - description: "Skip individual line items in an order"
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          enum:
                            - "SKIP_ITEM"
                        input:
                          type: "object"
