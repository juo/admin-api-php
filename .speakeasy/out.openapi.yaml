            minLength: 1
            type: "string"
          in: "query"
          name: "after"
          required: false
          description: "See [pagination](/docs/api-reference/admin/introduction#pagination) for more details on how to paginate the results."
        - schema:
            minLength: 1
            type: "string"
          in: "query"
          name: "before"
          required: false
          description: "See [pagination](/docs/api-reference/admin/introduction#pagination) for more details on how to paginate the results."
        - schema:
            default: "createdAt:desc"
            type: "string"
          in: "query"
          name: "sort"
          required: false
          description: "See [sorting](/docs/api-reference/admin/introduction#sorting) for more details on how to sort the results."
        - schema:
            default: false
            type: "boolean"
          in: "query"
          name: "includeArchived"
          required: false
          description: "Whether to include archived workflows in the results."
        - schema:
            default: false
            type: "boolean"
          in: "query"
          name: "filterNonInteractive"
          required: false
          description: "When true, only returns workflows containing at least one step whose action has behavior 'input' (i.e. workflows previewable in the editor)."
        - schema:
            default: false
            type: "boolean"
          in: "query"
          name: "excludeInteractive"
          required: false
          description: "When true, only returns workflows with no input-behavior action steps (i.e. workflows safe to run without a customer present to respond)."
        - schema:
            type: "string"
          in: "query"
          name: "triggerType"
          required: false
          description: "When set, only returns workflows registered with this trigger type."
        - schema:
            anyOf:
              - type: "string"
                enum:
                  - "draft"
              - type: "string"
                enum:
                  - "published"
              - type: "string"
                enum:
                  - "archived"
          in: "query"
          name: "status"
