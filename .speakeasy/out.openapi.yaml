                    type: "object"
                    additionalProperties:
                      type: "object"
                      properties:
                        totalEnrollments:
                          type: "number"
                        variantEnrollments:
                          type: "object"
                          patternProperties:
                            ^(.*)$:
                              type: "number"
                        metrics:
                          type: "array"
                          items:
                            type: "object"
                            properties:
                              metricId:
                                type: "string"
                              metricName:
                                type: "string"
                              variants:
                                type: "array"
                                items:
                                  type: "object"
                                  properties:
                                    variantId:
                                      type: "string"
                                    variantName:
                                      type: "string"
                                    sampleSize:
                                      type: "number"
                                    conversionRate:
                                      type: "number"
                                  required:
