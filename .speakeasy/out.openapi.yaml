  /analytics/query:
    post:
      summary: "Query analytics metrics"
      tags:
        - "analytics"
      description: "Executes a time-series analytics query for the given metric. Results are grouped into time buckets of the requested granularity and, optionally, by additional dimensions. Supports filtering via the segment IR, currency conversion for monetary metrics, and cohort analysis."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                metric:
                  description: "The metric to compute, e.g. `subscriptions:mrr`, `customers:count`, `subscriptions:purchased`."
                  anyOf:
                    - type: "string"
                      enum:
                        - "customers:count"
                    - type: "string"
                      enum:
                        - "customers:status-changes"
