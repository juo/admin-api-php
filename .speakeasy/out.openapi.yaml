                                        - "params"
                                    operator:
                                      anyOf:
                                        - type: "string"
                                          enum:
                                            - "equals"
                                        - type: "string"
                                          enum:
                                            - "not_equals"
                                        - type: "string"
                                          enum:
                                            - "greater_than"
                                        - type: "string"
                                          enum:
                                            - "greater_than_or_equal"
                                        - type: "string"
                                          enum:
                                            - "less_than"
                                        - type: "string"
