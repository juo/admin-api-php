        "403":
          description: "Forbidden — authenticated but not permitted to access this resource."
        "404":
          description: "Not found — the resource does not exist or belongs to a different tenant."
        "422":
          description: "Unprocessable entity — well-formed request that fails semantic validation."
    delete:
      summary: "Remove a variant from a subscription plan"
      tags:
        - "products"
      description: "Disassociates a specific product variant from a subscription plan group, removing it from eligibility under that plan."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                planId:
                  minLength: 1
                  description: "The subscription plan identifier"
                  type: "string"
              required:
                - "planId"
        required: true
      parameters:
        - schema:
            minLength: 1
            type: "string"
          in: "path"
          name: "productId"
          required: true
          description: "The product identifier"
        - schema:
            minLength: 1
            type: "string"
          in: "path"
          name: "variantId"
          required: true
          description: "The variant identifier"
        - $ref: "#/components/parameters/TenantHeader"
      x-speakeasy-name-override: "removeVariantFromPlan"
      x-speakeasy-mcp:
        scopes:
          - destructive
      x-speakeasy-group: "products"
      responses:
        "200":
          description: "Default Response"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  planId:
                    type: "string"
                  removed:
                    type: "boolean"
                    enum:
                      - true
                required:
                  - "planId"
                  - "removed"
        "400":
          description: "Bad request — invalid input or violated business rule (e.g., wrong subscription status for the requested operation)."
        "401":
          description: "Unauthorized — missing, expired, or invalid API key."
        "403":
          description: "Forbidden — authenticated but not permitted to access this resource."
        "404":
          description: "Not found — the resource does not exist or belongs to a different tenant."
        "422":
          description: "Unprocessable entity — well-formed request that fails semantic validation."
  /workflows/{id}/experiment/{stepId}/conclude:
    post:
      summary: "Conclude a workflow experiment"
      tags:
        - "workflows"
      description: "Concludes an A/B experiment on a specific workflow step. Use `select_winner` with a `winnerVariantId` to promote one variant as the permanent path for all future runs, or `stop` to end the experiment without selecting a winner and revert to the control path. In-flight runs continue on their already-assigned variant."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                action:
                  anyOf:
                    - type: "string"
                      enum:
                        - "select_winner"
                    - type: "string"
                      enum:
                        - "stop"
                winnerVariantId:
                  type: "string"
              required:
                - "action"
        required: true
      parameters:
        - schema:
            format: "uuid"
            type: "string"
          in: "path"
          name: "id"
          required: true
          description: "The workflow identifier"
        - schema:
            type: "string"
          in: "path"
          name: "stepId"
          required: true
          description: "The experiment step identifier"
