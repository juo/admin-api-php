    get:
      summary: "List schedule adjustments"
      tags:
        - "schedules"
      description: "Returns a paginated list of schedule adjustments. A schedule adjustment applies a targeted modification to upcoming orders matching the specified criteria (by cycle number, date, or both) — it never modifies the subscription itself. For permanent changes (billing frequency, items, payment method), update the subscription directly. Results are cursor-paginated."
      parameters:
        - schema:
            minLength: 1
            type: "string"
          in: "query"
          name: "customerId"
          required: true
          description: "The customer identifier"
        - schema:
            minimum: 1
            maximum: 100
            default: 20
            type: "integer"
          in: "query"
          name: "limit"
          required: false
          description: "See [pagination](/docs/api-reference/admin/introduction#pagination) for more details on how to paginate the results."
        - schema:
            minLength: 1
            type: "string"
          in: "query"
          name: "after"
          required: false
          description: "See [pagination](/docs/api-reference/admin/introduction#pagination) for more details on how to paginate the results."
        - schema:
            minLength: 1
            type: "string"
          in: "query"
          name: "before"
          required: false
          description: "See [pagination](/docs/api-reference/admin/introduction#pagination) for more details on how to paginate the results."
        - schema:
            default: "createdAt:asc"
            type: "string"
          in: "query"
          name: "sort"
          required: false
          description: "See [sorting](/docs/api-reference/admin/introduction#sorting) for more details on how to sort the results."
        - $ref: "#/components/parameters/TenantHeader"
      x-speakeasy-name-override: "listAdjustments"
      x-speakeasy-mcp:
        scopes:
          - read
      x-speakeasy-pagination:
        type: "cursor"
        inputs:
          - name: "after"
            in: "parameters"
            type: "cursor"
        outputs:
          nextCursor: "$.endCursor"
      x-speakeasy-group: "schedules"
      responses:
        "200":
          description: "Default Response"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  resource:
                    type: "string"
                    enum:
                      - "list"
                  hasNextPage:
                    type: "boolean"
                  hasPrevPage:
                    type: "boolean"
                  endCursor:
                    type:
                      - "null"
                      - "string"
                  startCursor:
                    type:
                      - "null"
                      - "string"
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ScheduleAdjustment"
                required:
                  - "resource"
