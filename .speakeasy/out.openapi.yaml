        "422":
          description: "Unprocessable entity — well-formed request that fails semantic validation."
servers:
  - url: "https://api.juo.io/admin/v1"
security:
  - AdminApiKey: []
  - BearerToken: []
x-speakeasy-globals:
  parameters:
    - $ref: "#/components/parameters/TenantHeader"
tags:
  - name: "subscriptions"
    description: "Recurring billing agreements with customers. Manage lifecycle (pause, resume, cancel, reactivate), items, and discounts."
  - name: "customers"
    description: "Customers who own subscriptions. Create and update customer records."
  - name: "products"
    description: "Products and variants linked to subscription plans. Manage catalog and plan assignments."
  - name: "schedules"
    description: "Read-only view of upcoming billing orders generated from subscription state, schedule adjustments, and workflows. Use schedule adjustments for targeted changes to upcoming orders (scoped by cycle number, date, or both) — they never alter the subscription itself. For permanent changes (billing frequency, items, payment method), update the subscription directly."
  - name: "workflows"
    description: "Interactive customer-facing flows for retention, dunning, and onboarding. Define steps, publish, and track execution runs and experiments."
  - name: "analytics"
    description: "Time-series metrics over subscriptions, customers and orders. Read the metric catalog first: it states what each metric means, the approximations it carries, and which filters and group-by dimensions the metric will honour — an unsupported filter is a 400, not an empty result."
