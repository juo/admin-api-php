      description: "Returns aggregate execution statistics for a workflow: total, successful, and failed run counts; per-node (step) entry execution counts; and per-experiment-step variant enrollment counts with per-metric conversion rates. Use to power analytics dashboards and experiment result views."
      parameters:
        - schema:
