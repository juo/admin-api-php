                    - type: "string"
                      enum:
                        - "order-items:revenue"
                    - type: "string"
                      enum:
                        - "subscriptions:cancellation-flow"
                    - type: "string"
                      enum:
                        - "customers:ltv"
                    - type: "string"
                      enum:
                        - "orders:lifetime-aov"
                    - type: "string"
                      enum:
                        - "customers:avg-lifetime-orders"
                    - type: "string"
                      enum:
                        - "subscriptions:churned"
                    - type: "string"
                      enum:
                        - "subscriptions:unique-churned"
                    - type: "string"
                      enum:
                        - "subscriptions:churned-mrr"
                    - type: "string"
                      enum:
                        - "orders:with-items"
                    - type: "string"
                      enum:
                        - "orders:item-aov"
                    - type: "string"
                      enum:
                        - "subscriptions:mrr"
                    - type: "string"
                      enum:
                        - "customers:revenue-per-customer"
                    - type: "string"
                      enum:
                        - "orders:count"
                    - type: "string"
                      enum:
